<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="quizContainer">
        <h1 class="quizHeading">Frontend Fundamentals</h1>
        
        <div class="questionContainer">
            <p class="questionCounter">Question&nbsp;<span id="questionNo">1</span>&nbsp;of 5</p>
            <h3 class="question">hello?</h3>
            <div class="options">
            </div>
            <div class="nextContainer">
                <button class="nextBtn">next</button>
            </div>
        </div>
        <div class="resultContainer hidden">
            <h2>Quiz Completed!</h2>
            <p class="scoreNo"></p>
            <button class="restartBtn">Restart Quiz</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
